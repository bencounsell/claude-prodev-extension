name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: E2E=1 npm run build
      - run: npx playwright install chromium --with-deps
      - run: CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())") xvfb-run npx playwright test
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: '*.zip' }
